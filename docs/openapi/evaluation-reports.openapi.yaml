openapi: 3.0.3
info:
  title: Evaluation Reports API
  version: 1.0.0
paths:
  /evaluation-reports/context:
    get:
      summary: Contexto y filtros de reportes de evaluación
      tags: [EvaluationReports]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Contexto institucional
  /evaluation-reports:
    get:
      summary: Reporte paginado de evaluación
      tags: [EvaluationReports]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: tipo
          required: true
          schema:
            enum:
              - promedios
              - notas
              - competencias
              - diagnostico
              - avance_evaluacion
        - in: query
          name: nivel
          schema: { type: string }
        - in: query
          name: grado
          schema: { type: string }
        - in: query
          name: seccion
          schema: { type: string }
        - in: query
          name: bimestre
          schema: { type: integer, minimum: 1, maximum: 4 }
      responses:
        '200':
          description: Reporte con meta, columns, items, pagination
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
