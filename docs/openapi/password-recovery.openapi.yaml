openapi: 3.0.3
info:
  title: EscolarERP — Recuperación de contraseña
  version: 1.0.0
  description: Flujo seguro de recuperación con token de un solo uso y expiración corta.
paths:
  /api/v1/auth/password-recovery/context:
    get:
      summary: Contexto institucional para pantalla de recuperación
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Contexto público
  /api/v1/auth/forgot-password:
    post:
      summary: Solicitar enlace de recuperación
      tags: [Auth]
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 64 }
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Respuesta genérica (no revela existencia de cuenta)
        '429':
          description: Límite de intentos excedido
  /api/v1/auth/reset-password:
    post:
      summary: Restablecer contraseña con token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, passwordNuevo, confirmPassword]
              properties:
                token: { type: string }
                passwordNuevo: { type: string, minLength: 8 }
                confirmPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Contraseña actualizada
        '400':
          description: Token inválido o política de contraseña
  /api/v1/auth/change-password:
    post:
      summary: Cambiar contraseña (usuario autenticado)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordActual, passwordNuevo, confirmPassword]
              properties:
                passwordActual: { type: string }
                passwordNuevo: { type: string, minLength: 8 }
                confirmPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Contraseña cambiada e invalidación de sesiones previas
        '401':
          description: Contraseña actual incorrecta
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
