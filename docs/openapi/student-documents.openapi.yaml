openapi: 3.0.3
info:
  title: Documentos del expediente estudiantil
  version: 1.0.0
paths:
  /students/documents/context:
    get:
      summary: Contexto institucional y reglas de carga
      tags: [StudentDocuments]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Límites, formatos y permisos
  /students/{id}/documents/{docId}/upload:
    post:
      summary: Cargar archivo (multipart) con versionado e integridad
      tags: [StudentDocuments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: docId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, motivo]
              properties:
                file:
                  type: string
                  format: binary
                motivo:
                  type: string
                  minLength: 3
                numero:
                  type: string
                vigenciaHasta:
                  type: string
                  format: date
      responses:
        '201':
          description: Versión creada
  /students/{id}/documents/{docId}/versions:
    get:
      summary: Historial de versiones
      tags: [StudentDocuments]
      security:
        - bearerAuth: []
  /students/{id}/documents/{docId}/versions/{versionId}/download:
    get:
      summary: Descargar versión (audita acceso)
      tags: [StudentDocuments]
      security:
        - bearerAuth: []
  /students/{id}/documents/audit:
    get:
      summary: Auditoría de operaciones documentales
      tags: [StudentDocuments]
      security:
        - bearerAuth: []
