services:
  postgres:
    image: postgres:16
    container_name: escolar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escolar
    ports:
      - '5433:5432'
    volumes:
      - escolar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d escolar']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  escolar_pg_data:
