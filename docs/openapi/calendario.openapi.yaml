openapi: 3.0.3
info:
  title: Calendarización escolar — Visualización por rol
  version: '1.1'
  description: |
    Vista agregada del calendario escolar (periodos, feriados, eventos) filtrada según el rol del usuario.
components:
  schemas:
    CalendarioRolVista:
      type: string
      enum: [gestion_ie, docente, padre, alumno, personal_ie, territorial]
    CalendarioContextResponse:
      type: object
      properties:
        institucion:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string }
            siglas: { type: string }
            anioEscolarActivo: { type: integer }
            ugel: { type: string }
            dre: { type: string }
        rolVista: { $ref: '#/components/schemas/CalendarioRolVista' }
        rolVistaLabel: { type: string }
        puedeGestionar: { type: boolean }
        anioVigente:
          type: object
          nullable: true
          properties:
            anio: { type: integer }
            publicado: { type: boolean }
            version: { type: integer }
    CalendarioVisualizacionResponse:
      type: object
      properties:
        contexto:
          type: object
          properties:
            anioEscolar: { type: integer }
            mes: { type: string }
            rolVista: { $ref: '#/components/schemas/CalendarioRolVista' }
            rolVistaLabel: { type: string }
            anioEscolarPublicado: { type: boolean }
        periodos: { type: array, items: { type: object } }
        feriados: { type: array, items: { type: object } }
        eventos: { type: array, items: { type: object } }
        dias: { type: array, items: { type: object } }
        resumen: { type: object }
paths:
  /api/v1/maestros/calendario/context:
    get:
      summary: Contexto institucional y permisos de visualización
      responses:
        '200':
          description: Contexto de calendario por rol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarioContextResponse'
        '403':
          description: Sin permiso
  /api/v1/maestros/calendario:
    get:
      summary: Calendario escolar agregado por rol
      parameters:
        - in: query
          name: anioEscolar
          schema: { type: integer, minimum: 2000 }
        - in: query
          name: mes
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          description: Mes en formato YYYY-MM
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: institutionId
          schema: { type: integer }
          description: Solo SIAGIE — institución a consultar
      responses:
        '200':
          description: Calendario con periodos, feriados, eventos y días tipados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarioVisualizacionResponse'
        '400':
          description: Rango fuera del año escolar o fechas inválidas
        '403':
          description: Sin permiso o calendario no publicado para el rol
