openapi: 3.0.3
info:
  title: Attendance Reports API
  version: 1.0.0
paths:
  /attendance-reports/context:
    get:
      summary: Contexto y filtros de reportes de asistencia
      tags: [AttendanceReports]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Contexto institucional
  /attendance-reports:
    get:
      summary: Reporte paginado de asistencia
      tags: [AttendanceReports]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: tipo
          required: true
          schema:
            enum: [asistencia_detalle, asistencia_resumen]
        - in: query
          name: mes
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
      responses:
        '200':
          description: Reporte con meta, columns, items, pagination
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
