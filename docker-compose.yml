version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: escolar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escolar
    ports:
      - '5433:5432'
    volumes:
      - escolar_pg_data:/var/lib/postgresql/data

volumes:
  escolar_pg_data:
