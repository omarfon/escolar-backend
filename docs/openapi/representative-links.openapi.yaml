openapi: 3.0.3
info:
  title: Vínculos representante-estudiante
  version: 1.0.0
paths:
  /representative-links/context:
    get:
      summary: Contexto institucional y permisos
      tags: [RepresentativeLinks]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contexto vigente
  /representative-links/by-document:
    get:
      summary: Buscar representante por documento
      tags: [RepresentativeLinks]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tipoDocumento
          schema:
            type: string
            default: DNI
        - in: query
          name: numeroDocumento
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Representante y vínculos
  /representative-links/associate:
    post:
      summary: Asociar uno o varios estudiantes a un representante
      tags: [RepresentativeLinks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoDocumento, numeroDocumento, representante, studentIds, tipoVinculo, motivo]
              properties:
                tipoDocumento:
                  type: string
                numeroDocumento:
                  type: string
                representante:
                  type: object
                  properties:
                    nombres:
                      type: string
                    apellidos:
                      type: string
                    email:
                      type: string
                    telefono:
                      type: string
                studentIds:
                  type: array
                  items:
                    type: integer
                tipoVinculo:
                  type: string
                  enum: [padre, madre, apoderado, abuelo, tio, hermano, otro]
                esPrincipal:
                  type: boolean
                motivo:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: Vínculos creados
  /representative-links/{id}:
    patch:
      summary: Actualizar vínculo activo
      tags: [RepresentativeLinks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vínculo actualizado
  /representative-links/{id}/cessation:
    post:
      summary: Cesar vínculo conservando historial
      tags: [RepresentativeLinks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: Vínculo cesado
  /representative-links/audit:
    get:
      summary: Historial de auditoría de vínculos
      tags: [RepresentativeLinks]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: representativeId
          schema:
            type: integer
        - in: query
          name: studentId
          schema:
            type: integer
      responses:
        '200':
          description: Registros de auditoría
